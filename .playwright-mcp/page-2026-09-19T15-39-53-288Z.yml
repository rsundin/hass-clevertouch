                  - generic [ref=f5e1033]:
                    - heading "CleverTouch - Home Assistant integration for Touch E3 radiators" [level=1] [ref=f5e1034]
                    - blockquote [ref=f5e1035]:
                      - paragraph [ref=f5e1036]:
                        - emphasis [ref=f5e1037]:
                          - strong [ref=f5e1038]: IMPORTANT!
                      - paragraph [ref=f5e1039]: This is not an officially supported integration nor software library. There are no guarantees that the functionality will work as expected.
                      - paragraph [ref=f5e1040]:
                        - text: Take caution especially when automating device
                        - emphasis [ref=f5e1041]: configuration
                        - text: .
                      - paragraph [ref=f5e1042]:
                        - emphasis [ref=f5e1043]:
                          - strong [ref=f5e1044]: THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND
                    - heading "Background" [level=2] [ref=f5e1045]
                    - paragraph [ref=f5e1046]:
                      - text: Yali Digital, Parada and Ramo is range of radiators from the Finnish company Purmo(*). The radiators may be monitored and controlled
                      - emphasis [ref=f5e1047]: centrally
                      - text: and wirelessly using the optional accessory TempCo Touch E3. The Touch E3 may in turn be controlled
                      - emphasis [ref=f5e1048]: remotely
                      - text: via a CleverTouch cloud account and related mobile and web apps.
                    - paragraph [ref=f5e1049]: This Home Assistant integration provides access to settings and usage data for homes and radiators accessible through CleverTouch accounts.
                    - paragraph [ref=f5e1050]: (*) Purmo has aquired several brands over time, and the radiator manufacturer might be known as e g LVI, Radson or Finimetal on local markets.
                    - heading "Other brands" [level=2] [ref=f5e1051]
                    - paragraph [ref=f5e1052]: While untested, a number of other product lines seem to be using the same controller software with different branding.
                    - paragraph [ref=f5e1053]: Applications using the following URLs might work, fully or partially.
                    - list [ref=f5e1054]:
                      - listitem [ref=f5e1055]:
                        - text: Walter Meier Metalplast smart-comfort -
                        - link "https://www.smartcomfort.waltermeier.com" [ref=f5e1056] [cursor=pointer]:
                          - /url: https://www.smartcomfort.waltermeier.com
                      - listitem [ref=f5e1057]:
                        - text: Frico PF Smart -
                        - link "https://fricopfsmart.frico.se" [ref=f5e1058] [cursor=pointer]:
                          - /url: https://fricopfsmart.frico.se
                      - listitem [ref=f5e1059]:
                        - text: Fenix V24 Wifi -
                        - link "https://v24.fenixgroup.eu" [ref=f5e1060] [cursor=pointer]:
                          - /url: https://v24.fenixgroup.eu
                      - listitem [ref=f5e1061]:
                        - text: Vogel & Noot E3 App - [Vogel & Noot E3 App -
                        - link "https://e3.vogelundnoot.com" [ref=f5e1062] [cursor=pointer]:
                          - /url: https://e3.vogelundnoot.com
                      - listitem [ref=f5e1063]:
                        - text: CordiVari My Way Cosy Home -
                        - link "https://cordivarihome.com" [ref=f5e1064] [cursor=pointer]:
                          - /url: https://cordivarihome.com
                    - heading "Installation" [level=2] [ref=f5e1065]
                    - paragraph [ref=f5e1066]: "The integration can be installed in three different ways:"
                    - heading "1. Using HACS" [level=3] [ref=f5e1067]
                    - paragraph [ref=f5e1068]:
                      - text: The repository is not included in HACS by default, but it may be added as a custom repository by following the
                      - link "HACS documentation" [ref=f5e1069] [cursor=pointer]:
                        - /url: https://hacs.xyz/docs/faq/custom_repositories/
                      - text: .
                    - heading "2. Cloning the Github repository" [level=3] [ref=f5e1070]
                    - paragraph [ref=f5e1071]:
                      - text: The repository files should be placed in the sub-directory
                      - code [ref=f5e1072]: custom_components/clevertouch
                      - text: of the HomeAssistant configuration directory.
                    - list [ref=f5e1073]:
                      - listitem [ref=f5e1074]:
                        - text: Create the
                        - code [ref=f5e1075]: custom_components
                        - text: directory if it doesn't already exist.
                      - listitem [ref=f5e1076]:
                        - code [ref=f5e1077]: cd
                        - text: to the folder.
                      - listitem [ref=f5e1078]: Run the command
                    - code [ref=f5e1080]: git clone https://github.com/hemphen/hass-clevertouch.git clevertouch
                    - list [ref=f5e1081]:
                      - listitem [ref=f5e1082]: Restart HomeAssistant.
                      - listitem [ref=f5e1083]: Add the integration via the GUI.
                    - paragraph [ref=f5e1084]:
                      - text: Please note that this will clone the latest code changes in the main branch, which may not always be fully stable or tested. To install a specific release, add a
                      - code [ref=f5e1085]: "--branch"
                      - text: flag to the
                      - code [ref=f5e1086]: clone
                      - text: command, e.g
                    - code [ref=f5e1088]: git clone https://github.com/hemphen/hass-clevertouch.git clevertouch --branch v0.2.4
                    - heading "3. Manually downloading a release file" [level=3] [ref=f5e1089]
                    - paragraph [ref=f5e1090]:
                      - text: Download the
                      - code [ref=f5e1091]: source.zip
                      - text: file for any release from Github and extract the contents into the
                      - code [ref=f5e1092]: custom_components/clevertouch
                      - text: directory within the HomeAssistant config directory.
                    - heading "Usage" [level=2] [ref=f5e1093]
                    - paragraph [ref=f5e1094]: The intergration is configurable from the HomeAssistant GUI. Once installed correctly, it should appear in the list of integrations. Enter username (email) and password for the CleverTouch account during setup.
                    - paragraph [ref=f5e1095]: After congfiguration, all available homes and radiators will be added as devices, with temperature settings added as entities.
                    - paragraph [ref=f5e1096]: To avoid calling the API too excessively information is updated every three minutes.
                    - heading "Unsupported features" [level=3] [ref=f5e1097]
                    - list [ref=f5e1098]:
                      - listitem [ref=f5e1099]: Installation-wide settings are not available.
                      - listitem [ref=f5e1100]: Schedules for radiators running in program mode are not available.
                    - heading "API" [level=2] [ref=f5e1101]
                    - paragraph [ref=f5e1102]:
                      - text: The API used to communicate with the CleverTouch account is located in a stand-alone repository
                      - link "https://github.com/hemphen/clevertouch" [ref=f5e1103] [cursor=pointer]:
                        - /url: https://github.com/hemphen/clevertouch
                      - text: and is also available on PyPi.
              - button "Download" [ref=f5e1105] [cursor=pointer]
